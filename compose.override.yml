services:
  proxy:
    image: nginx:1
    network_mode: host
    volumes:
      - ./deploy/example.nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    restart: no
    ports:
      - 127.0.0.1:5432:5432

  backend:
    restart: no
    ports:
      - 127.0.0.1:8000:8000
    environment:
      - UV_NO_DEV=0
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    restart: no
    ports:
      - 127.0.0.1:3000:80
