services:
  proxy:
    image: traefik:3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:80"
      - "8081:8080" # Traefik dashboard
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --accesslog
      - --log
      - --log.level=DEBUG
      - --api
      - --api.insecure=true

  db:
    restart: no
    ports:
      - 5432:5432

  backend:
    restart: no
    ports:
      - 8000:8000
    environment:
      - UV_NO_DEV=0
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    restart: no
    ports:
      - 3000:80
